<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Virtual Tour</title>

  <link rel="stylesheet" href="pannellum.css"/>
  <script src="pannellum.js"></script>

  <style>
    html,
    body,
    #panorama {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div id="panorama"></div>

<script>
  pannellum.viewer('panorama', {

    default: {
      firstScene: 'scene1',
      sceneFadeDuration: 1000,
      autoLoad: true
    },

    scenes: {

      scene1: {
        title: 'Pièce 1',
        panorama: 'Panorama1_003.png',

        hotSpotDebug: true,

        hotSpots: [

          {
            pitch: -10,
            yaw: 0,
            type: 'scene',
            sceneId: 'scene2',
            text: 'Go to Pièce 2'
          },

          {
            pitch: -5,
            yaw: 40,
            type: 'scene',
            sceneId: 'scene3',
            text: 'Go to Pièce 3'
          }

        ]
      },

      scene2: {
        title: 'Pièce 2',
        panorama: 'Panorama2_003.png',

        hotSpotDebug: true,

        hotSpots: [

          {
            pitch: -10,
            yaw: -62,
            type: 'scene',
            sceneId: 'scene1',
            text: 'Retour Pièce 1'
          },

          {
            pitch: -8,
            yaw: 35,
            type: 'scene',
            sceneId: 'scene3',
            text: 'Go to Pièce 3'
          }

        ]
      },

      scene3: {
        title: 'Pièce 3',
        panorama: 'Panorama3_001.png',

        hotSpotDebug: true,

        hotSpots: [

          {
            pitch: -9,
            yaw: -53,
            type: 'scene',
            sceneId: 'scene1',
            text: 'Retour Pièce 1'
          },

          {
            pitch: -6,
            yaw: 20,
            type: 'scene',
            sceneId: 'scene2',
            text: 'Go to Pièce 2'
          }

        ]
      }

    }

  });
</script>

</body>
</html>
